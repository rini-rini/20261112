<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猜拳遊戲</title>
    <link rel="stylesheet" href="./css/hw2-猜拳.css">
</head>
<body>
    <div class="all">
        <img class="bg" src="./img/背景1.jpg" alt="背景">
        <div class="title">
            <h1>剪刀石頭布</h1>
            <p>Let's Play Together!</p>
        </div>
        <div class="game-area">
            <div class="computer">
                <p>COMPUTER</p>
                <div class="computer-show">?</div>
            </div>
            <div class="vs">VS</div>
            <div class="player">
                <p>PLAYER</p>
                <div class="user-show">?</div>
            </div>
        </div>
        <div class="message">選擇你要出的拳</div>
        <div class="choose-area">
            <div class="choose-1">
                <p>剪刀</p>
            </div>
            <div class="choose-2">
                <p>石頭</p>
            </div>
            <div class="choose-3">
                <p>布</p>
            </div>
        </div>
        <button class="start-btn">START GAME</button>
    </div>
</body>
</html>
